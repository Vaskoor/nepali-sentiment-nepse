# =============================================================================
# CI pipeline — lint, test (matrix), reproducibility smoke run, docker build
# Triggers: push to main/master, pull_request, manual dispatch.
# =============================================================================
name: CI

"on":
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Lint & format check (fast, no deps beyond ruff/black)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install linters
        run: pip install ruff==0.6.9 black==24.8.0
      - name: Ruff check
        run: ruff check src tests scripts api dashboard
      - name: Black --check
        run: black --check src tests scripts api dashboard
      - name: YAML lint (structural)
        run: |
          python - <<'PY'
          import glob, sys
          try:
              import yaml
          except ImportError:
              print("PyYAML not installed, installing...")
              import subprocess; subprocess.check_call([sys.executable,"-m","pip","install","pyyaml"])
              import yaml
          ok = True
          for f in glob.glob("**/*.yml", recursive=True) + glob.glob("**/*.yaml", recursive=True):
              if "node_modules" in f: continue
              try:
                  with open(f) as fh: yaml.safe_load(fh)
                  print(f"OK  {f}")
              except Exception as e:
                  print(f"ERR {f}: {e}"); ok = False
          sys.exit(0 if ok else 1)
          PY

  # ---------------------------------------------------------------------------
  # 2. Unit tests (matrix across Python versions, core deps only)
  # ---------------------------------------------------------------------------
  test:
    name: Test (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]
        exclude:
          # macOS 3.10 wheels occasionally flaky for xgboost; skip
          - os: macos-latest
            python: "3.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Show versions
        run: |
          python -c "import numpy,pandas,sklearn,xgboost,pytest; print('numpy',numpy.__version__,'pandas',pandas.__version__,'sklearn',sklearn.__version__,'xgboost',xgboost.__version__)"
      - name: Run pytest
        run: pytest tests -v --tb=short
      - name: Upload coverage (ubuntu-py311 only)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: |
          pytest tests --cov=nepse_nlp --cov-report=xml -q || true
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 3. Reproducibility smoke run — execute Phase 1->5 scripts end-to-end
  #    Verifies the whole pipeline reproduces on a clean runner.
  # ---------------------------------------------------------------------------
  pipeline-smoke:
    name: Pipeline smoke run (Phase 1->5)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Phase 1 — preprocessing
        run: |
          mkdir -p results data/processed
          python scripts/phase1_preprocess.py
      - name: Run Phase 2 — Jev benchmark
        run: python scripts/phase2_benchmark.py
      - name: Run Phase 3 — hybrid pipeline
        run: python scripts/phase3_hybrid.py
      - name: Run Phase 4 — NEPSE prediction
        run: python scripts/phase4_predict.py
      - name: Run Phase 5 — backtest
        run: python scripts/phase5_backtest.py
      - name: Verify artifacts produced
        run: |
          ls -la results/
          test -f results/phase2_benchmark.json
          test -f results/phase3_pareto.json
          test -f results/phase4_models.json
          test -f results/phase5_backtest.json
          test -f results/equity_curve.csv
          test -f data/processed/news_sentiment.csv
          test -f data/processed/nepse_daily.csv
          echo "All pipeline artifacts present."
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-results
          path: |
            results/
            data/processed/
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 4. Docker build (verify Dockerfile is buildable; push only on tags)
  # ---------------------------------------------------------------------------
  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: nepali-sentiment-nepse:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
